<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Murmur · LinkedIn banner</title>
    <link rel="stylesheet" href="../shared/brand.css" />
    <style>
      /* LinkedIn's profile photo covers the left ~420px on desktop; start copy after it. */
      .artboard {
        --glow-x: 55%;
        --glow-y: 50%;
      }
      .copy {
        position: absolute;
        left: 560px;
        top: 50%;
        transform: translateY(-50%);
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 17px;
        color: var(--fg-3);
      }
      .eyebrow .rec {
        font-size: 17px;
      }
      h1 {
        margin-top: 18px;
        font-size: 62px;
      }
      .foot {
        margin-top: 20px;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 22px;
      }
      .foot .rule {
        width: 48px;
      }
      .flock-wrap {
        position: absolute;
        right: 64px;
        top: 50%;
        transform: translateY(-50%);
        width: 400px;
        height: 200px;
      }
      .flock-wrap canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <main class="artboard bg" data-w="1584" data-h="396">
      <div class="copy">
        <p class="mono eyebrow"><span class="rec"></span>Building Murmur · in public</p>
        <h1 class="display">Voice memo in.<br /><span class="accent">Whole</span> project out.</h1>
        <p class="foot"><span class="rule"></span><span class="url">trymurmur.studio</span></p>
      </div>
      <div class="flock-wrap"><canvas data-flock data-seed="21" data-bars="34" data-count="3200" data-size="1"></canvas></div>
    </main>
    <script src="../shared/brand.js"></script>
  </body>
</html>
